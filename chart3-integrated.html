<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chart 3 — Integrated final picks</title>
<style>
  :root { box-sizing: border-box; --bg:#ffffff; --fg:#1a1915; --muted:#5b6470; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16161a; --fg:#ececec; --muted:#9aa2ad; } }
  :root[data-theme="dark"] { --bg:#16161a; --fg:#ececec; --muted:#9aa2ad; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--fg);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  h1 { font-size:17px; margin:0 0 4px; font-weight:600; }
  .sub { font-size:12px; color:var(--muted); margin-bottom:14px; }
  .legend { display:flex; flex-wrap:wrap; gap:11px; margin-bottom:10px; font-size:11.5px; color:var(--muted); }
  .legend span { display:flex; align-items:center; gap:5px; }
  .wrap { position:relative; width:100%; max-width:900px; height:450px; }
</style>
</head>
<body>
<h1>Chart 3 — Integrated final picks</h1>
<div class="sub">All vendors · Artificial Analysis Intelligence Index v4.3 · cost per task (USD)</div>
<div class="legend">
  <span><i style="width:10px;height:10px;border-radius:50%;background:#2a78d6"></i>OpenAI</span>
  <span><i style="width:10px;height:10px;border-radius:2px;background:#eb6834"></i>Anthropic</span>
  <span><i style="width:9px;height:9px;background:#1baf7a;transform:rotate(45deg)"></i>Z AI (GLM)</span>
  <span><i style="width:16px;height:0;border-top:2px dashed #5b6470"></i>Qwen local (ref)</span>
  <span><i style="width:14px;height:14px;border-radius:50%;border:2px solid currentColor"></i>Final pick</span>
</div>
<div class="wrap"><canvas id="cv"></canvas></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const FG = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim() || '#1a1915';
const PICK=[[0.18,38,'Bulk'],[0.82,46,'Workhorse'],[2.31,53,'Top']];
const isP=(x,y)=>PICK.some(p=>p[0]===x&&p[1]===y);
const OA='#2a78d6',AN='#eb6834',ZA='#1baf7a',SLT='#5b6470';
const F=[
 ['Astra',OA,'circle',[[0.82,46,'low'],[1.54,50,'medium'],[1.72,51,'high'],[2.31,53,'xhigh'],[3.26,53,'max']],[1.54,50,'GPT-6 Astra',-6,-13]],
 ['Sol',OA,'circle',[[0.26,34,'low'],[0.50,39,'medium'],[0.81,42,'high'],[1.18,44,'xhigh'],[1.99,47,'max']],[0.26,34,'Sol',0,17]],
 ['Terra',OA,'circle',[[0.14,28,'low'],[0.18,30,'medium'],[0.34,34,'high'],[0.63,38,'xhigh'],[1.40,42,'max']],[0.14,28,'Terra',0,17]],
 ['Luna',OA,'circle',[[0.01,22,'low'],[0.02,25,'medium'],[0.04,32,'high'],[0.09,35,'xhigh'],[0.18,38,'max']],[0.01,22,'Luna',4,17]],
 ['Fable 5.1 (excl.)',AN,'rect',[[2.37,47,'low'],[2.98,49,'medium'],[3.91,51,'high'],[5.98,53,'xhigh'],[7.63,53,'max']],[5.98,53,'Fable 5.1 (excl.)',0,-13]],
 ['Opus 5',AN,'rect',[[1.10,40,'low'],[2.19,45,'medium'],[3.61,48,'high'],[4.88,50,'xhigh'],[5.86,51,'max']],[3.61,48,'Opus 5',0,15]],
 ['Sonnet 5',AN,'rect',[[0.51,25,'low'],[1.00,28,'medium'],[1.79,32,'high'],[2.87,35,'xhigh'],[5.09,38,'max']],[0.51,25,'Sonnet 5',0,17]],
 ['Haiku 4.5',AN,'rect',[[0.21,18,'']],[0.21,18,'Haiku 4.5',0,-12]],
 ['GLM',ZA,'rectRot',[[0.25,42,'5.3-Flash'],[2.01,45,'5.3 max']],[0.25,42,'GLM-5.3-Flash',0,-13]]
];
const QL=[[34,'Qwen3.8 27B xhigh (local)'],[40,'Qwen3.8-Flash-Next (local)']];
const ds=[];
F.forEach(([n,c,st,pts])=>ds.push({label:n,data:pts.map(p=>({x:p[0],y:p[1],l:p[2]||''})),pointStyle:st,
 pointRadius:pts.map(p=>isP(p[0],p[1])?8:4.5),showLine:pts.length>1,tension:0,
 borderColor:c+(pts.some(p=>isP(p[0],p[1]))?'cc':'40'),borderWidth:1.5,
 pointBackgroundColor:pts.map(p=>isP(p[0],p[1])?c:c+'40'),
 pointBorderColor:pts.map(p=>isP(p[0],p[1])?c:c+'40')}));
const qlines={id:'qlines',beforeDatasetsDraw(c){const x=c.ctx,sy=c.scales.y,a=c.chartArea;x.save();
 x.strokeStyle=SLT+'70';x.lineWidth=1.5;x.setLineDash([6,4]);
 QL.forEach(q=>{const py=sy.getPixelForValue(q[0]);x.beginPath();x.moveTo(a.left,py);x.lineTo(a.right,py);x.stroke();});
 x.setLineDash([]);x.restore();}};
const lab={id:'lab',afterDatasetsDraw(c){const x=c.ctx,sx=c.scales.x,sy=c.scales.y,a=c.chartArea;x.save();
 x.font='500 10px sans-serif';
 F.forEach(([n,c2,st,pts,L])=>{const px=sx.getPixelForValue(L[0]),py=sy.getPixelForValue(L[1]);
  x.fillStyle=c2+'bb';x.textAlign=L[3]>0?'left':'center';x.fillText(L[2],px+L[3],py+L[4]);});
 PICK.forEach(p=>{const px=sx.getPixelForValue(p[0]),py=sy.getPixelForValue(p[1]);
  x.strokeStyle=FG;x.lineWidth=2.5;x.beginPath();x.arc(px,py,15,0,6.29);x.stroke();
  x.textAlign='center';x.fillStyle=FG;x.font='600 11.5px sans-serif';x.fillText(p[2],px,py-26);});
 x.font='500 9.5px sans-serif';x.fillStyle=SLT;x.textAlign='center';
 {const a1=sx.getPixelForValue(0.18),b1=sx.getPixelForValue(0.82),yy=sy.getPixelForValue(42.5);
  x.fillText('+8 pts · 4.6x',(a1+b1)/2,yy);
  const a2=sx.getPixelForValue(0.82),b2=sx.getPixelForValue(2.31),yy2=sy.getPixelForValue(50.5);
  x.fillText('+7 pts · 2.8x',(a2+b2)/2,yy2);}
 x.font='600 9.5px sans-serif';x.fillStyle=SLT;x.textAlign='left';
 QL.forEach(q=>{const py=sy.getPixelForValue(q[0]);x.fillText(q[1],a.left+4,py-6);});
 x.restore();}};
new Chart(document.getElementById('cv'),{type:'scatter',data:{datasets:ds},
 options:{responsive:true,maintainAspectRatio:false,layout:{padding:{left:30,right:40,top:30,bottom:8}},
  plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.dataset.label+(c.raw.l?' '+c.raw.l:'')+' · '+c.parsed.y+' pts · $'+c.parsed.x.toFixed(2)}}},
  scales:{x:{type:'logarithmic',min:0.008,max:14,title:{display:true,text:'Cost per task (USD, log scale)'},
    ticks:{callback:v=>[0.01,0.02,0.05,0.1,0.2,0.5,1,2,5,10].includes(v)?'$'+v:''}},
   y:{min:14,max:58,title:{display:true,text:'Intelligence Index v4.3'}}}},plugins:[qlines,lab]});
</script>
</body>
</html>
