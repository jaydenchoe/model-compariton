<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chart 1 — OpenAI lineup</title>
<style>
  :root { box-sizing: border-box; --bg:#ffffff; --fg:#1a1915; --muted:#5b6470; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16161a; --fg:#ececec; --muted:#9aa2ad; } }
  :root[data-theme="dark"] { --bg:#16161a; --fg:#ececec; --muted:#9aa2ad; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--fg);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  h1 { font-size:17px; margin:0 0 4px; font-weight:600; }
  .sub { font-size:12px; color:var(--muted); margin-bottom:14px; }
  .legend { display:flex; flex-wrap:wrap; gap:11px; margin-bottom:10px; font-size:11.5px; color:var(--muted); }
  .legend span { display:flex; align-items:center; gap:5px; }
  .wrap { position:relative; width:100%; max-width:900px; height:440px; }
</style>
</head>
<body>
<h1>Chart 1 — OpenAI lineup</h1>
<div class="sub">Artificial Analysis Intelligence Index v4.3.2 · cost per task (USD)</div>
<div class="legend">
  <span><i style="width:10px;height:10px;border-radius:50%;background:#2a78d6"></i>Astra</span>
  <span><i style="width:10px;height:10px;border-radius:2px;background:#eb6834"></i>Sol</span>
  <span><i style="width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid #1baf7a"></i>Terra</span>
  <span><i style="width:9px;height:9px;background:#eda100;transform:rotate(45deg)"></i>Luna</span>
  <span><i style="width:16px;height:2px;background:#7b52d1;opacity:.45"></i>Anthropic (ref)</span>
  <span><i style="width:16px;height:2px;background:#5b6470;opacity:.45"></i>GLM (ref)</span>
  <span><i style="width:16px;height:0;border-top:2px dashed #5b6470"></i>Qwen local (ref)</span>
  <span><i style="width:14px;height:14px;border-radius:50%;border:2px solid currentColor"></i>Picked</span>
</div>
<div class="wrap"><canvas id="cv"></canvas></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const FG = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim() || '#1a1915';
const PICK=[[0.18,37,'Bulk'],[0.82,46,'Workhorse'],[2.31,52,'Top']];
const isP=(x,y)=>PICK.some(p=>p[0]===x&&p[1]===y);
const D=[
 ['Astra','#2a78d6','circle',7,[[0.82,46,'low',0,16],[1.54,50,'medium',-8,-12],[1.73,51,'high',12,-4],[2.31,52,'xhigh',2,-12],[3.26,53,'max',12,0]]],
 ['Sol','#eb6834','rect',7,[[0.26,33,'low',0,15],[0.50,39,'medium',0,-12],[0.81,42,'high',0,-12],[1.18,44,'xhigh',12,2],[1.99,47,'max',12,0]]],
 ['Terra','#1baf7a','triangle',8,[[0.14,27,'low',0,16],[0.18,30,'medium',13,2],[0.34,34,'high',0,-12],[0.63,38,'xhigh',0,-12],[1.40,42,'max',13,6]]],
 ['Luna','#eda100','rectRot',8,[[0.01,21,'low',0,16],[0.02,25,'medium',13,4],[0.04,32,'high',0,-12],[0.09,35,'xhigh',0,-12],[0.18,37,'max',0,17]]]
];
const REF=[['Fable 5.1 (excl.)','#7b52d1',[[2.37,47],[2.98,49],[3.91,51],[5.98,53],[7.63,53]],null],
 ['Opus 5','#7b52d1',[[1.10,39],[2.19,45],[3.61,48],[4.88,50],[5.86,51]],null],
 ['Sonnet 5','#7b52d1',[[0.51,24],[1.00,28],[1.79,32],[2.87,34],[5.09,38]],null],
 ['Haiku 4.5','#7b52d1',[[0.21,17]],null],
 ['GLM','#5b6470',[[0.25,42],[2.01,45]],[['GLM-5.3-Flash',0,-13],['GLM-5.3 max',10,-4]]]];
const QL=[[34,'Qwen3.8 27B xhigh (local)'],[40,'Qwen3.8-Flash-Next (local)']];
const SLT='#5b6470', fade=c=>c+'45', ds=[];
D.forEach(([n,c,st,r,m])=>ds.push({label:n,data:m.map(p=>({x:p[0],y:p[1],l:p[2]})),pointStyle:st,
 pointRadius:m.map(p=>isP(p[0],p[1])?r+1:r),showLine:true,tension:0,borderColor:c+'cc',borderWidth:1.5,
 pointBackgroundColor:c,pointBorderColor:c}));
REF.forEach(([n,c,pts,pl])=>ds.push({label:n,data:pts.map((p,i)=>({x:p[0],y:p[1],l:pl?pl[i][0].replace('GLM-',''):''})),pointStyle:'circle',
 pointRadius:3.5,showLine:pts.length>1,tension:0,borderColor:fade(c),borderWidth:1.5,
 pointBackgroundColor:fade(c),pointBorderColor:fade(c)}));
const qlines={id:'qlines',beforeDatasetsDraw(c){const x=c.ctx,sy=c.scales.y,a=c.chartArea;x.save();
 x.strokeStyle=SLT+'70';x.lineWidth=1.5;x.setLineDash([6,4]);
 QL.forEach(q=>{const py=sy.getPixelForValue(q[0]);x.beginPath();x.moveTo(a.left,py);x.lineTo(a.right,py);x.stroke();});
 x.setLineDash([]);x.restore();}};
const lab={id:'lab',afterDatasetsDraw(c){const x=c.ctx,sx=c.scales.x,sy=c.scales.y,a=c.chartArea;x.save();
 x.font='600 11.5px sans-serif';x.textAlign='center';
 PICK.forEach(p=>{const px=sx.getPixelForValue(p[0]),py=sy.getPixelForValue(p[1]);
  x.strokeStyle=FG;x.lineWidth=2.5;x.beginPath();x.arc(px,py,14,0,6.29);x.stroke();
  x.fillStyle=FG;x.fillText(p[2],px,py-24);});
 x.font='500 9.5px sans-serif';
 D.forEach(([n,c2,st,r,m])=>m.forEach(p=>{const px=sx.getPixelForValue(p[0]),py=sy.getPixelForValue(p[1]);
  x.fillStyle=c2;x.textAlign=p[3]>0?'left':'center';x.fillText(p[2],px+p[3],py+p[4]);}));
 REF.forEach(([n,c3,pts,pl])=>{
  if(pl){x.font='600 9.5px sans-serif';x.fillStyle=c3;
   pl.forEach((q,i)=>{const px=sx.getPixelForValue(pts[i][0]),py=sy.getPixelForValue(pts[i][1]);
    x.textAlign=q[1]>0?'left':'center';x.fillText(q[0],px+q[1],py+q[2]);});}
  else{x.font='500 11px sans-serif';x.fillStyle=c3+'aa';x.textAlign='center';
   const px=sx.getPixelForValue(pts[0][0]),py=sy.getPixelForValue(pts[0][1]);x.fillText(n,px,py+20);}});
 x.font='600 9.5px sans-serif';x.fillStyle=SLT;x.textAlign='left';
 QL.forEach(q=>{const py=sy.getPixelForValue(q[0]);x.fillText(q[1],a.left+4,py-6);});
 x.restore();}};
new Chart(document.getElementById('cv'),{type:'scatter',data:{datasets:ds},
 options:{responsive:true,maintainAspectRatio:false,layout:{padding:{left:30,right:40,top:28,bottom:8}},
  plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.dataset.label+(c.raw.l?' '+c.raw.l:'')+' · '+c.parsed.y+' pts · $'+c.parsed.x.toFixed(2)}}},
  scales:{x:{type:'logarithmic',min:0.008,max:14,title:{display:true,text:'Cost per task (USD, log scale)'},
    ticks:{callback:v=>[0.01,0.02,0.05,0.1,0.2,0.5,1,2,5,10].includes(v)?'$'+v:''}},
   y:{min:14,max:58,title:{display:true,text:'Intelligence Index v4.3.2'}}}},plugins:[qlines,lab]});
</script>
</body>
</html>
